name: Deploy to O2Switch

on:
  push:
    branches:
      - master  # Déclenche l'action uniquement lors des push sur la branche master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Cette action récupère ton code source

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.8.1  # Remplace par la version de pnpm que tu utilises

      - name: Install dependencies
        run: pnpm install  # Installe toutes les dépendances avec pnpm

      - name: Build the project
        run: pnpm run build  # Crée le build de production

      - name: Deploy to O2Switch via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist
          remote-dir: /public_html  # Modifie si ton site est dans un sous-dossier
